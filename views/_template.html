  SCREEN TEMPLATE. Copy this file, rename it to your screen (e.g. views/products.html) and delete this comment.
  Screen names that already have a route:  products  price-list  technology  gallery  store-locator  support  about  sitemap
  You own TWO files:  views/<name>.html  and  css/<name>.css.  Do not edit any other file.
  Open it at:  index.html#/<name>   (with Live Server)
  Keep the very last line of this file (the closing comment about Live Server) exactly as it is. Never type that tag name anywhere else.
-->
<link rel="stylesheet" href="css/NAME.css">

<!-- Every screen starts with a page head -->
<section class="page-head">
  <h1 class="title split"><span>Screen title</span></h1>
  <span class="rule reveal"></span>
  <p class="sub reveal" style="--i:1">One short line about this screen</p>
</section>

<!-- Then alternate dark and ivory sections. Reading-heavy = ivory, photo-heavy = dark. -->
<section class="section section--dark">
  <div class="wrap">
    <h2 class="title reveal">Section title</h2>
    <p class="reveal" style="--i:1">Short text. One idea per block.</p>
  </div>
</section>

<section class="section section--ivory">
  <div class="wrap">
    <p class="eyebrow reveal">Small label</p>
    <h2 class="title reveal">Another section</h2>
  </div>
</section>

<!-- </body> (keeps VS Code Live Server from cutting this file short; leave it as the last line) -->
