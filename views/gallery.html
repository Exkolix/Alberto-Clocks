<link rel="stylesheet" href="css/gallery.css">

<section class="page-head">
  <h1 class="title split"><span>The <em>Gallery</em></span></h1>
  <span class="rule reveal"></span>
  <p class="sub reveal" style="--i:1">A closer look at the collection</p>
</section>

<!-- Photos hang in 5-tile blocks: one tall tile in the middle, two stacked on each side.
     To add a photo, copy one <a> line. Real photos replace the files in assets/img/gallery/ (same names). -->
<section class="section section--void gal-section">
  <div class="wrap">
    <div class="gal-grid" id="galGrid">
      <div class="gal-block">
      <a class="gal-item gal-a reveal-img" style="--i:0" href="assets/img/gallery/g1.svg" data-full="assets/img/gallery/g1.svg" aria-label="Open photo 1"><img src="assets/img/gallery/g1.svg" alt="Gold-rimmed perpetual watch on a dark brown ground" loading="lazy"></a>
      <a class="gal-item gal-b reveal-img" style="--i:1" href="assets/img/gallery/g2.svg" data-full="assets/img/gallery/g2.svg" aria-label="Open photo 2"><img src="assets/img/gallery/g2.svg" alt="Skeleton watch showing its movement" loading="lazy"></a>
      <a class="gal-item gal-main reveal-img" style="--i:2" href="assets/img/gallery/g3.svg" data-full="assets/img/gallery/g3.svg" aria-label="Open photo 3"><img src="assets/img/gallery/g3.svg" alt="Diver watch with a deep blue dial" loading="lazy"></a>
      <a class="gal-item gal-d reveal-img" style="--i:3" href="assets/img/gallery/g4.svg" data-full="assets/img/gallery/g4.svg" aria-label="Open photo 4"><img src="assets/img/gallery/g4.svg" alt="Tourbillon watch with a silver case" loading="lazy"></a>
      <a class="gal-item gal-e reveal-img" style="--i:4" href="assets/img/gallery/g5.svg" data-full="assets/img/gallery/g5.svg" aria-label="Open photo 5"><img src="assets/img/gallery/g5.svg" alt="Green aviator watch on a leather strap" loading="lazy"></a>
      </div>
      <div class="gal-block">
      <a class="gal-item gal-a reveal-img" style="--i:0" href="assets/img/gallery/g6.svg" data-full="assets/img/gallery/g6.svg" aria-label="Open photo 6"><img src="assets/img/gallery/g6.svg" alt="Cream-dial chronograph with a brown strap" loading="lazy"></a>
      <a class="gal-item gal-b reveal-img" style="--i:1" href="assets/img/gallery/g7.svg" data-full="assets/img/gallery/g7.svg" aria-label="Open photo 7"><img src="assets/img/gallery/g7.svg" alt="Titanium smart watch" loading="lazy"></a>
      <a class="gal-item gal-main reveal-img" style="--i:2" href="assets/img/gallery/g8.svg" data-full="assets/img/gallery/g8.svg" aria-label="Open photo 8"><img src="assets/img/gallery/g8.svg" alt="Slim dress watch with an ivory dial" loading="lazy"></a>
      <a class="gal-item gal-d reveal-img" style="--i:3" href="assets/img/gallery/g9.svg" data-full="assets/img/gallery/g9.svg" aria-label="Open photo 9"><img src="assets/img/gallery/g9.svg" alt="Racing chronograph with a red bezel" loading="lazy"></a>
      <a class="gal-item gal-e reveal-img" style="--i:4" href="assets/img/gallery/g10.svg" data-full="assets/img/gallery/g10.svg" aria-label="Open photo 10"><img src="assets/img/gallery/g10.svg" alt="Green solar trail watch" loading="lazy"></a>
      </div>
    </div>
  </div>
</section>

<!-- Viewer: js/gallery.js fills and shows it -->
<div class="gal-viewer" id="galViewer" role="dialog" aria-modal="true" aria-label="Photo viewer" hidden>
  <button class="gal-x" type="button" aria-label="Close viewer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" aria-hidden="true"><path d="M4 4l16 16M20 4L4 20"/></svg></button>
  <button class="gal-nav gal-prev" type="button" aria-label="Previous photo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
  <button class="gal-nav gal-next" type="button" aria-label="Next photo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
  <figure class="gal-stage"><img id="galImg" src="" alt=""></figure>
  <p class="gal-count" id="galCount" aria-live="polite"></p>
</div>

<!-- </body> (keeps VS Code Live Server from cutting this file short; leave it as the last line) -->
