<link rel="stylesheet" href="css/products.css">

<section class="page-head">
  <h1 class="title split"><span>Our <em>Watches</em></span></h1>
  <span class="rule reveal"></span>
  <p class="sub reveal" style="--i:1" id="prodSub">All collections</p>
</section>

<section class="section section--charcoal prod-section">
  <div class="wrap prod-layout">

    <!-- Filters: left sidebar on desktop, a "Filters" button on phones -->
    <aside class="pf" aria-label="Filters">
      <button class="pf-toggle" type="button" data-bs-toggle="collapse" data-bs-target="#pfBody" aria-expanded="false" aria-controls="pfBody">
        <span>Filters</span>
        <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><path d="M6 1v10M1 6h10"/></svg>
      </button>

      <div class="pf-body collapse" id="pfBody">
        <div class="pf-head">
          <h2 class="pf-title">Filters</h2>
          <button class="pf-reset" type="button" id="pfReset">Reset</button>
        </div>

        <fieldset class="pf-group">
          <legend class="pf-label">Collection</legend>
          <label class="pf-check check-lux"><input class="form-check-input" type="checkbox" data-line="vintage"><span class="pf-name">Vintage</span><span class="pf-n" data-count="vintage"></span></label>
          <label class="pf-check check-lux"><input class="form-check-input" type="checkbox" data-line="luxury"><span class="pf-name">Luxury</span><span class="pf-n" data-count="luxury"></span></label>
          <label class="pf-check check-lux"><input class="form-check-input" type="checkbox" data-line="smart"><span class="pf-name">Smart Watches</span><span class="pf-n" data-count="smart"></span></label>
        </fieldset>

        <div class="pf-group">
          <div class="pf-row">
            <label class="pf-label" for="priceRange">Price ceiling</label>
            <output class="pf-val" id="priceOut" for="priceRange" aria-live="polite">All prices</output>
          </div>
          <input type="range" id="priceRange" min="0" max="100" step="1" value="100">
          <div class="pf-ticks" aria-hidden="true"><span id="priceMin"></span><span id="priceMax"></span></div>
        </div>

        <div class="pf-group pf-group--last">
          <label class="pf-label" for="sortBy">Order</label>
          <select id="sortBy">
            <option value="default">Collection</option>
            <option value="price-asc">Price, low to high</option>
            <option value="price-desc">Price, high to low</option>
            <option value="name">Name, A to Z</option>
          </select>
        </div>
      </div>
    </aside>

    <!-- Results -->
    <div class="prod-main">
      <div class="prod-bar">
        <div class="ps">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
          <input type="search" id="prodSearch" placeholder="Search watches" aria-label="Search watches" autocomplete="off" spellcheck="false">
          <button class="ps-clear" type="button" id="prodSearchClear" aria-label="Clear search" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>
        <p class="prod-count" id="prodCount" aria-live="polite"></p>
      </div>
      <div class="prod-grid" id="productGrid"></div>
    </div>

  </div>
</section>
